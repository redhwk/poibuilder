name: Nightly

# Every night the `nightly` tag is moved to the current master HEAD and a
# prerelease carrying the Godot-importable addon zip is published for it
# (replacing the previous nightly release). Also runnable by hand.
on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest master
        uses: actions/checkout@v5

      - name: Build bundled docs
        # The screenshots/clips under docs/site/assets/ are COMMITTED, so the
        # site builds fully on CI without the showcase capture pipeline.
        # --strict fails the run if a page references a missing file — a
        # nightly full of "Screenshot not built yet" placeholders must never
        # ship again.
        run: ./docs/site/build.sh --bundle --strict

      - name: Zip the addon for Godot import
        run: |
          cd project
          # Top-level entries are `addons/...` so the zip extracts straight
          # into a Godot project folder. docs-site/ is produced by build.sh --bundle.
          zip -r ../PoiBuilder-nightly.zip addons/poibuilder
          cd ..
          unzip -l PoiBuilder-nightly.zip | head -20


      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The changelog section needs the PREVIOUS nightly commit: fetch the
          # tag before it is retargeted below. First run (no tag yet): the
          # changelog falls back to the last 20 commits.
          PREV_SHA=""
          if git fetch origin nightly --no-tags 2>/dev/null; then
            PREV_SHA=$(git rev-parse FETCH_HEAD)
          fi

          # Replace the previous nightly release if one exists (without
          # --cleanup-tag, which would delete the tag both on remote and locally
          # and cause subsequent git push failures).
          gh release delete nightly --yes || true

          # Point the nightly tag to this commit and push it to origin.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

          VERSION=$(sed -n 's/^version="\(.*\)"/\1/p' project/addons/poibuilder/plugin.cfg)
          HEAD_SHA=$(git rev-parse --short HEAD)
          {
            echo "PoiBuilder **v${VERSION}** — automatic alpha build of master."
            echo
            echo "Built from [$HEAD_SHA](https://github.com/Francesco149/poibuilder/commit/$(git rev-parse HEAD))"\
              "($(git log -1 --date=short --format='%ad'))."
            echo
            echo "### Changes since the previous nightly"
            echo
            if [ -n "$PREV_SHA" ]; then
              git log --format='- %s ([%h](https://github.com/Francesco149/poibuilder/commit/%H))' "$PREV_SHA..HEAD"
              if [ "$(git rev-list --count "$PREV_SHA..HEAD")" = "0" ]; then
                echo "- no new commits; rebuild of the same tree"
              fi
            else
              git log --max-count=20 --format='- %s ([%h](https://github.com/Francesco149/poibuilder/commit/%H))'
            fi
            echo
            echo "### Install"
            echo "1. Download \`PoiBuilder-nightly.zip\` below."
            echo "2. Extract it into your Godot project folder (it contains"\
              "\`addons/poibuilder\`)."
            echo "3. Enable the plugin via Project → Project Settings → Plugins."
            echo
            echo "Offline docs are bundled at \`addons/poibuilder/docs-site/\`"\
              "— the **Docs** button in the PoiBuilder toolbar opens them."
            echo
            echo "This is an **alpha** release: expect rough edges and file"\
              "breaking changes in saved scenes until 1.0."
          } > notes.md
          gh release create nightly PoiBuilder-nightly.zip \
            --title "PoiBuilder nightly $(date -u +%Y-%m-%d)" \
            --notes-file notes.md \
            --prerelease
